<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 圆角方形背景 -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#bg)"/>
  
  <!-- 标签形状（左侧尖角） -->
  <path d="M14 14 L24 24 L14 34 Z" fill="white" opacity="0.95"/>
  
  <!-- 右侧方框（数据/标注框） -->
  <rect x="24" y="16" width="18" height="16" rx="3" fill="none" stroke="white" stroke-width="2.5" opacity="0.9"/>
  
  <!-- 方框内的小勾（完成/标注） -->
  <path d="M29 24 L32 27 L38 21" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  
  <!-- 顶部光点（智能感） -->
  <circle cx="36" cy="12" r="2" fill="white" opacity="0.7"/>
</svg>
