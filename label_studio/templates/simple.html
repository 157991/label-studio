{% load static %}
{% load i18n %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="author" content=""/>
  <meta name="viewport" content="width=device-width, initial-scale=0.9, shrink-to-fit=no">

  <!-- Address string color -->
  <meta name="theme-color" content="#272727"> <!-- Chrome, Firefox OS and Opera -->
  <meta name="msapplication-navbutton-color" content="#272727">  <!-- Windows Phone -->
  <meta name="apple-mobile-web-app-status-bar-style" content="#272727">  <!-- iOS Safari -->

  <link href="{{settings.HOSTNAME}}{% static 'css/main.css' %}" rel="stylesheet"/>
  {% block app-css %}
    <link href="{{settings.FRONTEND_HOSTNAME}}/react-app/main.css?v={{ versions.backend.commit }}" rel="stylesheet">
  {% endblock %}


  {% block page_labeling %}
    <title>智引标注</title>
    <link href="{{settings.HOSTNAME}}{% static 'images/favicon.ico' %}" rel="shortcut icon"/>
  {% endblock %}

  {% block head %}
  {% endblock %}

  {% block theme_colors %}
    <script>
      function handleThemeColor() {
        let themeColor = window.localStorage.getItem("preferred-color-scheme");
        if (themeColor === "Auto") {
          themeColor = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "Dark" : "Light"
        } else if (!themeColor) {
          themeColor = "Light";
        }
        document.documentElement.setAttribute("data-color-scheme", themeColor.toLowerCase());
      }
      handleThemeColor();
    </script>
  {% endblock %}
<style id="whitelabel-brand-cleanup">
/* 白标：隐藏官方推广和品牌元素 */

/* ========== 登录页左侧区域 ========== */
/* 隐藏左侧 Logo（SVG） */
.login_page_new_ui .left > svg:first-child {
  display: none !important;
}

/* 隐藏"你知道吗？"提示卡片 */
.login_page_new_ui .left .tips {
  display: none !important;
}

/* 隐藏"技术支持" + HumanSignal */
.login_page_new_ui .left .by {
  display: none !important;
}

/* 修改左侧背景色：科技感深蓝→紫色渐变 */
.login_page_new_ui .left {
  background: linear-gradient(135deg, #EFF6FF 0%, #E0E7FF 40%, #F5F3FF 100%) !important;
}

/* 隐藏左侧底部装饰图 */
.login_page_new_ui .left:after {
  display: none !important;
}

/* ========== Heidi 负鼠和提示 ========== */
.lsf-heidy-tip,
.lsf-heidy-tip__title,
.lsf-heidy-tip__header,
.lsf-heidy-tip__content,
[class*="heidy" i],
[class*="heidi" i] {
  display: none !important;
}

/* ========== 右侧边栏资源卡片（外链） ========== */
.grid-cols-\[minmax\(0\,1fr\)_450px\] > :nth-child(2) > .rounded-lg.border.border-neutral-border {
  display: none !important;
}

section.flex.flex-col.gap-6 > div.rounded-lg.border.border-neutral-border:has(.text-2xl) {
  display: none !important;
}

/* ========== 平台版本信息 ========== */
section.flex.flex-col.gap-6 > .flex.gap-2.items-center:has(.text-neutral-content-subtle) {
  display: none !important;
}

.flex.gap-2.items-center:has(> .text-neutral-content-subtle) {
  display: none !important;
}

/* ========== 侧边栏底部外链（API/文档/GitHub/社区） ========== */
/* 通用：所有外部文档链接 */
a[href*="labelstud.io"],
a[href*="github.com"],
a[href*="slack"] {
  display: none !important;
}

/* 侧边栏菜单里的外部链接 */
.lsf-sidebar a[href*="labelstud.io"],
.lsf-sidebar a[href*="github.com"],
.lsf-sidebar a[href*="slack"] {
  display: none !important;
}

/* 侧边栏底部版本号 */
.lsf-sidebar [class*="version" i] {
  display: none !important;
}

/* ========== AWS/企业版推广 ========== */
[class*="aws" i],
[class*="marketplace" i],
[class*="upgrade-to-enterprise" i],
[class*="promo-banner" i] {
  display: none !important;
}

/* ========== HumanSignal 品牌 ========== */
[class*="humansignal" i],
[class*="human-signal" i] {
  display: none !important;
}
</style>



</head>

  var __brandName = '智引标注';
  var __defaultLang = 'zh-CN';
  var currentLang = localStorage.getItem('ls-whitelabel-lang') || __defaultLang;

  function getTranslation(text) {
    if (currentLang === 'en') return text;
    var trimmed = text.trim();
    if (!trimmed) return text;
    if (__translations[trimmed]) {
      var leading = text.match(/^\s*/)[0];
      var trailing = text.match(/\s*$/)[0];
      return leading + __translations[trimmed] + trailing;
    }
    var lower = trimmed.toLowerCase();
    for (var key in __translations) {
      if (key.toLowerCase() === lower) {
        var leading = text.match(/^\s*/)[0];
        var trailing = text.match(/\s*$/)[0];
        return leading + __translations[key] + trailing;
      }
    }
    return text;
  }

  var translatedNodes = new WeakSet();

    if (!node || node.nodeType !== 3) return;
    if (!node.nodeValue || !node.nodeValue.trim()) return;

    var translated = getTranslation(originalText);
    if (translated !== originalText) {
      node.nodeValue = translated;
      node.__originalText = originalText;
    }
    translatedNodes.add(node);
  }

  function translateElement(element) {

    if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'NOSCRIPT' || tag === 'CODE' || tag === 'PRE') return;

      acceptNode: function(node) {

      }

  function translatePage() {

    if (document.title) {

      newTitle = newTitle.replace(/Label\s*Studio/gi, __brandName);
      if (newTitle !== document.title) {

  function init() {
